[project]
name = "bloodwork-parsing"
version = "0.1.0"
description = "Parse pdf data and store them in a timeseries DB"
requires-python = ">=3.13"
dependencies = [
    "camelot-py>=1.0.9,<2",
    "fastapi>=0.165.0",
    "influxdb3-python>=0.21.0",
    "opencv-python-headless>=5.1.0.95",
    "pandas>=3.1.1",
    "pdfplumber>=0.11.11",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.17.6",
    "ty>=0.0.108",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["app", "scripts"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]
