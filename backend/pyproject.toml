[project]
name = "bloodwork-parsing"
version = "0.1.0"
description = "Parse pdf data and store them in a timeseries DB"
requires-python = ">=3.13"
dependencies = [
    "camelot-py>=1.0.9",
    "fastapi>=0.116.1",
    "influxdb3-python>=0.15.0",
    "opencv-python-headless>=4.12.0.88",
    "pandas>=2.3.2",
    "pdfplumber>=0.11.7",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.1",
    "python-multipart>=0.0.20",
    "uvicorn>=0.35.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.17.6",
    "ty>=0.0.107",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["app", "scripts"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]
